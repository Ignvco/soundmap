apply plugin: 'com.android.application'

// ── Firma de release ─────────────────────────────────────────────────────────
// El repo trae `app/keystore/soundmap-release-key.jks` pero NADA la conectaba
// al build: `assembleRelease` producía un APK sin firmar, que Android se niega
// a instalar. Acá se conecta, leyendo las credenciales de `keystore.properties`
// (fuera de control de versiones) o de variables de entorno para CI.
//
// Si el archivo no existe, el bloque se omite y los builds de debug siguen
// funcionando igual — no hace falta configurar nada para probar en tu teléfono.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProps = keystorePropertiesFile.exists()
if (hasKeystoreProps) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def storePasswordValue = hasKeystoreProps ? keystoreProperties['storePassword'] : System.getenv("SOUNDMAP_STORE_PASSWORD")
def keyAliasValue      = hasKeystoreProps ? keystoreProperties['keyAlias']      : System.getenv("SOUNDMAP_KEY_ALIAS")
def keyPasswordValue   = hasKeystoreProps ? keystoreProperties['keyPassword']   : System.getenv("SOUNDMAP_KEY_PASSWORD")
def canSignRelease = storePasswordValue != null && keyAliasValue != null && keyPasswordValue != null

android {
    namespace = "com.levelproaudio.soundmap"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.levelproaudio.soundmap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (canSignRelease) {
        signingConfigs {
            release {
                storeFile file("keystore/soundmap-release-key.jks")
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            // Se deja en false a propósito. Capacitor carga sus plugins por
            // REFLEXIÓN (@CapacitorPlugin), así que activar R8 sin las reglas
            // keep correctas hace que la app compile pero crashee al arrancar.
            // Las reglas ya están escritas en proguard-rules.pro: para activarlo
            // poné esto en true y PROBÁ EL APK DE RELEASE EN UN DISPOSITIVO REAL
            // (el de debug no ejecuta R8, así que no sirve para validar esto).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
